# CAVEAT — gltest configuration.
# Studio Next / Studio-dev preview, chain 61997. Never point this at StudioNet 61999.
#
# Direct tests need nothing here. Integration tests run with:
#   gltest --network studio_devnet
networks:
  default: studio_devnet
  studio_devnet:
    id: 61997
    url: https://studio-next.genlayer.com/api
    default_wait_interval: 3000
    default_wait_retries: 60

paths:
  contracts: contracts
  # gltest manages this directory itself and clears it between runs, so keep it away
  # from artifacts/, which holds committed deployment and lifecycle evidence.
  artifacts: build/gltest

environment: .env
